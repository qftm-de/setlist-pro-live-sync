services:
  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
  api:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && gunicorn core.wsgi --bind 0.0.0.0:8000"
    environment:
      APP_MODE: core
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY setzen, Namen stehen in backend/.env.example}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      INSTANCE_NAME: ${INSTANCE_NAME:-Setlist Pro Live Sync}
      COMMUNITY_URL: ${COMMUNITY_URL:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-api,localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-setlist}
      POSTGRES_USER: ${POSTGRES_USER:-setlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen, Namen stehen in backend/.env.example}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 5s
      timeout: 3s
      retries: 10
  db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-setlist}
      POSTGRES_USER: ${POSTGRES_USER:-setlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen, Namen stehen in backend/.env.example}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-setlist}"]
      interval: 5s
      timeout: 3s
      retries: 10
  cache:
    image: redis:8.10.3-alpine
volumes:
  pgdata:
