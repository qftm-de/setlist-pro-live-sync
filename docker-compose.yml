services:
  web:
    build:
      context: ./frontend
      args:
        VITE_COMMUNITY_URL: ${COMMUNITY_URL:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
  api:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && gunicorn core.wsgi --bind 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-api,localhost,127.0.0.1}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-setlist}
      POSTGRES_USER: ${POSTGRES_USER:-setlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen, Namen stehen in backend/.env.example}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 5s
      timeout: 3s
      retries: 10
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-setlist}
      POSTGRES_USER: ${POSTGRES_USER:-setlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen, Namen stehen in backend/.env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-setlist}"]
      interval: 5s
      timeout: 3s
      retries: 10
  cache:
    image: redis:7-alpine
volumes:
  pgdata:
