# ponytail: Client-IP aus X-Forwarded-For nur von lokalen/privaten Adressen
# uebernehmen. So zaehlt das Anmeldelimit den echten Client hinter dem
# TLS-Proxy. Wer direkt aus dem LAN kommt, koennte den Header selbst setzen;
# aus dem Internet kommt jeder Aufruf ueber den Proxy.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ponytail: Pruefe den direkten Peer ($realip_remote_addr), nicht den
# aufgeloesten Client. Sonst gilt jeder Internetnutzer hinter dem TLS-Proxy
# als nicht vertrauenswuerdig und Django sieht nie https.
geo $realip_remote_addr $vertrauenswuerdig {
    default 0;
    127.0.0.0/8 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

# ponytail: X-Forwarded-Proto nur von vertrauenswuerdigen Clients, sonst $scheme.
map "$vertrauenswuerdig:$http_x_forwarded_proto" $forwarded_proto {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

# ponytail: 20 Anmeldungen pro Minute je IP, burst 10. Eine Band hinter einem
# WLAN teilt sich eine IP, 5/min hätte bei Tippfehlern alle gesperrt.
# Gegen Ratenraten reicht das; bei Bedarf Zone schärfen oder App-Throttle dazu.
limit_req_zone $binary_remote_addr zone=anmeldung:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=admin:1m rate=30r/m;
# Oeffentliche Einladungslinks: 20 Aufrufe pro Minute je IP, burst 10.
limit_req_zone $binary_remote_addr zone=einladung:1m rate=20r/m;

# Einladungspfade tragen den Klartext-Token. Das Zugriffslog ersetzt ihn,
# bevor die Zeile geschrieben wird.
log_format redigiert '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $log_uri$is_args$args $server_protocol" '
                     '$status $body_bytes_sent "$log_referer" "$http_user_agent"';

map $uri $log_uri {
    default $uri;
    ~^/(?<einladung_prefix>api/invitations|api/beitritt|einladung|beitritt)/[^/]+(?<einladung_rest>/.*)?$ /$einladung_prefix/[token]$einladung_rest;
}

map $http_referer $log_referer {
    default $http_referer;
    ~^(?<ref_prefix>https?://[^/]+/(?:api/invitations|api/beitritt|einladung|beitritt)/)[^/?#]+(?<ref_rest>.*)$ $ref_prefix[token]$ref_rest;
}

map $http_host $ziel_host {
    "" $host;
    default $http_host;
}

server {
    listen 80;
    server_name _;

    # Docker-DNS bei jedem Request neu auflösen, damit ein API-Neustart mit
    # neuer Container-IP nicht bis zum nginx-Neustart 502 liefert.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Aus derselben Groessenkonfiguration wie die API abgeleitet. 0 deaktiviert.
    client_max_body_size __PDF_PROXY_MAX_BODY__;

    root /usr/share/nginx/html;
    index index.html;

    # Alle Zugriffe laufen ueber das redigierte Format. Der Token erscheint
    # hoechstens als [token], auch bei 429 und Upstream-Fehlern.
    access_log /dev/stdout redigiert;

    # $host schneidet den Port ab. Django vergleicht den Origin-Header samt
    # Port, sonst scheitert der CSRF-Check bei nicht standardisierten Ports.
    proxy_set_header Host $ziel_host;
    proxy_set_header X-Forwarded-Host $ziel_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location = /api/anmeldung/ {
        limit_req zone=anmeldung burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
    }

    location ^~ /api/invitations/ {
        # Das Zugriffslog redigiert den Token. Das Fehlerlog bleibt bei crit,
        # weil nginx dort die angefragte URL nicht ersetzen kann. Den Status
        # eines 429 oder Upstream-Fehlers zeigt die Zugriffszeile.
        error_log /dev/stderr crit;
        limit_req zone=einladung burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
    }

    location ^~ /api/beitritt/ {
        # Oeffentlicher Instanz-Beitritt: eigener Token, dieselbe Bremse und
        # dieselbe Log-Redaktion wie die Band-Einladung.
        error_log /dev/stderr crit;
        limit_req zone=einladung burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
    }

    location /api/ {
        proxy_pass $api_upstream;
    }

    # WebSocket-Abgleich. Die Zeitüberschreitung muss über dem Heartbeat liegen.
    # proxy_set_header im location ersetzt die geerbten Header, deshalb werden
    # sie hier wiederholt.
    location /ws/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $ziel_host;
        proxy_set_header X-Forwarded-Host $ziel_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /admin/ {
        limit_req zone=admin burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $api_upstream;
    }

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 1h;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # ES-Module des PDF.js-Workers. nginx kennt .mjs nicht in jeder Fassung.
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Der geteilte Einladungslink enthält den Klartext-Token im Pfad.
    # strict-origin hält den Token aus dem Referer und lässt beim POST den
    # eigenen Origin stehen. no-referrer würde den Origin auf null setzen und
    # den CSRF-Check von Django mit 403 brechen. add_header erbt nicht,
    # deshalb alle Header wiederholen.
    location ^~ /einladung/ {
        error_log /dev/stderr crit;
        add_header Referrer-Policy "strict-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files /index.html =404;
    }

    # Instanz-Einladung: derselbe Token im Pfad, derselbe Schutz.
    location ^~ /beitritt/ {
        error_log /dev/stderr crit;
        add_header Referrer-Policy "strict-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
