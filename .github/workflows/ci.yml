name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Requirements-Gate
        run: node scripts/requirements-gate.mjs --check
      - name: Security-Baseline
        run: node scripts/review-constraints.mjs
      - name: Dokumentation
        run: node scripts/docs-sync.mjs
        env:
          REQUIREMENTS_DIFF_BASE: ${{ github.event.before }}
      - name: Dateigrößen
        run: node scripts/lint-file-size.mjs
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --no-banner --redact --exit-code 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typprüfung und Build
        run: npm run build
      - name: Tests
        run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_DB: setlist
          POSTGRES_USER: setlist
          POSTGRES_PASSWORD: ci-only-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U setlist"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_MODE: core
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      TRUST_PROXY_HEADERS: "false"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: setlist
      POSTGRES_USER: setlist
      POSTGRES_PASSWORD: ci-only-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Testkonfiguration erzeugen
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt
      - name: Django-Systemprüfung
        run: python manage.py check
      - name: Tests gegen PostgreSQL
        run: python manage.py test

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.1
      - name: npm-Abhängigkeiten prüfen
        run: |
          npm audit --audit-level=high
          cd frontend && npm audit --audit-level=high
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Python-Abhängigkeiten prüfen
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict

  kern:
    runs-on: ubuntu-latest
    needs: [gate, frontend, backend]
    env:
      VERIFY_SKIP_FRONTEND: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Root-Abhängigkeiten
        run: npm ci --no-audit --no-fund
      - name: Frontend-Abhängigkeiten
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Chromium für Browser-Smokes
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Kern-Smoke mit echten Browsern
        run: node scripts/verify-kern.mjs
      - name: Echtzeit-Abgleich
        run: node scripts/verify-realtime.mjs R13
      - name: Echtzeit R14
        run: node scripts/verify-realtime.mjs R14
      - name: Echtzeit R15
        run: node scripts/verify-realtime.mjs R15
