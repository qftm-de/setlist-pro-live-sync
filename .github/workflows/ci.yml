name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Requirements-Gate
        run: node scripts/requirements-gate.mjs --check
      - name: Security-Baseline
        run: node scripts/review-constraints.mjs
      - name: Dateigrößen
        run: node scripts/lint-file-size.mjs
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typprüfung und Build
        run: npm run build
      - name: Tests
        run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_DB: setlist
          POSTGRES_USER: setlist
          POSTGRES_PASSWORD: ci-only-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U setlist"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_MODE: core
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      TRUST_PROXY_HEADERS: "false"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: setlist
      POSTGRES_USER: setlist
      POSTGRES_PASSWORD: ci-only-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Testkonfiguration erzeugen
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt
      - name: Django-Systemprüfung
        run: python manage.py check
      - name: Tests gegen PostgreSQL
        run: python manage.py test
