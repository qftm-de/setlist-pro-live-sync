name: Fehler
description: Etwas funktioniert nicht wie beschrieben
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Bitte keine Zugangsdaten, echten Bandcodes oder Nutzerdaten eintragen.
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Was hast du erwartet
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version oder Commit
    validations:
      required: true
  - type: dropdown
    id: modus
    attributes:
      label: Betriebsmodus
      options:
        - core
        - core mit COMMUNITY_URL
        - hub
    validations:
      required: true
  - type: textarea
    id: umgebung
    attributes:
      label: Umgebung
      description: Browser, Gerät, Betriebssystem, falls relevant
    validations:
      required: false
